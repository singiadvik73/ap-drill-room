name: Save Claude-written questions

on:
  schedule:
    - cron: "17 7 * * *"   # every day at 07:17 UTC
  workflow_dispatch:        # or run it any time from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull questions from the shared bank
        run: python3 src/sync_community.py
      - name: Rebuild the site
        run: python3 src/build.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "No new questions."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/community.js index.html
          git commit -m "Add Claude-written questions from the shared bank"
          git push
