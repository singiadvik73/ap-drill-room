      </form>
      <p class="muted" style="font-size:12.5px">An account covers practice and progress. AI features (explanations and new questions) need your own Claude API key, which you can add after signing in.</p>
    </section>`;
  } else if (HOSTED && signed) {
    modeHtml = `
    <div class="acc-cards">
      ${CFG.claudeAppUrl ? `<section class="acc-card">
        <h2 class="sec">Use AP Drill Room in Claude</h2>
        <p>Open the Claude version to get explanations and new questions with your <b>Claude plan's usage</b>, no API key needed. Questions you make there are added to the pool for everyone when you use <b>Link Google account</b> in it.</p>
        <div class="frow"><a class="btn primary" id="lk-claude" href="${esc(CFG.claudeAppUrl)}" target="_blank" rel="noopener">Open in Claude</a><span class="muted" style="font-size:12.5px">Also copies a link code, so you can bring this account's progress along: in Claude, paste it under Account → Bring progress from the website.</span></div>
      </section>` : ""}
      ${unsubmittedClaudeQs().length || lastSubmit || uncheckedClaudeQs().length ? `<section class="acc-card">
        <h2 class="sec">Questions from the Claude version</h2>
        <p>${unsubmittedClaudeQs().length ? `You have <b>${unsubmittedClaudeQs().length}</b> question${unsubmittedClaudeQs().length === 1 ? "" : "s"} you generated in the Claude version that aren't in the shared bank yet.` : "All your checked questions from the Claude version are in the shared pool."}</p>
        <p class="muted">Claude checked these in the Claude version, using your Claude usage there. Sharing adds them to the question pool for everyone. It's free and doesn't use your API key.</p>
        ${uncheckedClaudeQs().length ? `<p class="muted">${uncheckedClaudeQs().length} other question${uncheckedClaudeQs().length === 1 ? "" : "s"} from the Claude version haven't been checked by Claude, so they stay private. To share them, open the Claude version and use <b>Check with Claude</b> on its Account page, then link again.</p>` : ""}
        ${lastSubmit ? `<p class="muted">Last time: ${lastSubmit.added} added${lastSubmit.duplicates ? `, ${lastSubmit.duplicates} already in the pool` : ""}${lastSubmit.overLimit ? ", the rest wait for tomorrow (daily limit)" : ""}.</p>` : ""}
        ${unsubmittedClaudeQs().length ? `<div class="frow"><button class="btn small primary" type="button" id="cv-submit">Share with everyone</button></div>` : ""}
      </section>` : ""}
      <section class="acc-card">
        <h2 class="sec">Claude API key</h2>
        ${!CFG.aiEndpoint ? `<p class="muted">The site owner hasn't turned on AI features yet.</p>`
          : keyStatus === null ? `<p class="muted">Checking your saved key…</p>`
          : keyStatus.saved ? `<p><span class="okdot"></span>Saved to your account: <code>${esc(keyStatus.hint)}</code>${keyStatus.savedAt ? ` · since ${esc(fmtDate(keyStatus.savedAt))}` : ""}</p>
              <p class="muted">It works on any device where you sign in. It's stored encrypted and is never shown or sent back to your browser. Each time you open the site, you'll be asked before AI features use your credits.</p>
              <p class="muted">Questions you generate are added to the shared question bank for everyone.</p>
              <div class="frow"><button class="btn small ghost" type="button" id="ak-wipe">Remove key from my account</button><button class="btn small ghost" type="button" id="ak-replace">Replace key</button></div>`
          : `<div class="notice"><b>AI features aren't included with a Google account.</b> To get explanations and generate new questions, add your own Claude API key. Anthropic bills you per use.</div>`}
        ${CFG.aiEndpoint && keyStatus ? `<details class="howto" ${!keyStatus.saved || replacingKey ? "open" : ""}>
          <summary>How to get a Claude API key</summary>
          <ol>
            <li><b>Open the Claude Console.</b> Go to <a href="https://platform.claude.com/" target="_blank" rel="noopener">platform.claude.com</a> and sign in, or create a Console account. This is separate from a Claude Pro or Max subscription, which doesn't include API use.</li>
            <li><b>Add credits.</b> In the Console, open <b>Billing</b> and add credits. You only pay for what you use. An explanation or a set of 5 questions usually costs a few cents.</li>
            <li><b>Create a key.</b> Go to <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">Settings → API keys</a> and click <b>Create key</b>. Name it something like <i>AP Drill Room</i> and pick an expiration.</li>
            <li><b>Copy it right away.</b> The key starts with <code>sk-ant-</code> and is shown <b>only once</b>. If you lose it, create a new one.</li>
            <li><b>Paste it here.</b> Put it in the box below, check the box to agree, and click <b>Save key to my account</b>.</li>
          </ol>
          <p class="muted">Tip: make a key just for this site. To stop at any time, click <b>Remove key from my account</b> here, or delete the key in the Console. Anthropic's terms apply to API accounts, so if you're under 18, ask a parent or teacher to set this up.</p>
          <p class="muted">Official guide: <a href="https://platform.claude.com/docs/en/get-api-key" target="_blank" rel="noopener">Get your Claude API key</a></p>
        </details>` : ""}
        ${CFG.aiEndpoint && keyStatus && (!keyStatus.saved || replacingKey) ? `<form id="ak-form" class="edform" novalidate>
            <label for="ak-key">Claude API key</label>
            <input id="ak-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
            <label class="checkrow" for="ak-agree"><input type="checkbox" id="ak-agree"> I understand AI features will use my Claude API credits, and I'll confirm each time I open the site.</label>
            <p class="muted" style="font-size:12.5px">Your key is checked with Anthropic, then stored encrypted with your account. The site never shows it again, and you can remove it anytime.</p>
            <p class="ederr" id="ak-err" role="alert" hidden></p>
            <div class="frow"><button class="btn primary" type="submit" id="ak-save">Save key to my account</button>${replacingKey ? `<button class="btn ghost" type="button" id="ak-cancel">Cancel</button>` : ""}</div>
          </form>` : ""}
      </section>
    </div>`;
  }

  $app.innerHTML = `
    <section class="acchead">
      <div class="acc-av">${signed && me && me.avatarUrl ? `<img src="${esc(me.avatarUrl)}" alt="">` : ""}</div>
      <div><div class="abbr">${head.tag}</div><h1 id="acc-name"></h1><p class="muted" id="acc-sub"></p></div>
      <div class="acc-sync">
        <span class="syncpill" id="acct-sync" data-s="${syncState.s}">${esc(syncLabel())}</span>
        ${canSync() ? `<button class="btn small" type="button" id="acc-syncnow">Sync now</button>` : ""}
      </div>
    </section>
    ${modeHtml}
    <div class="stats accstats">
      <div class="stat"><b>${answered || Object.values(progress).reduce((n, r) => n + r[0], 0)}</b><span>Answers logged</span></div>
      <div class="stat"><b>${m.acc == null ? "—" : Math.round(m.acc * 100) + "%"}</b><span>Accuracy</span></div>
      <div class="stat"><b>${m.mastered}</b><span>Questions mastered</span></div>
      <div class="stat"><b>${st.cur}</b><span>Day streak</span></div>
      <div class="stat"><b>${st.best}</b><span>Best streak</span></div>
    </div>
    <h2 class="sec">Activity</h2>
    <div class="fig" style="margin-top:10px">${heatmap()}</div>
    <h2 class="sec">By course</h2>
    <div class="acc-courses">${COURSES.map(c => {
      const cm = mastery(courseQs(c));
      const weak = c.topicList.map(t => ({ t, m: mastery(t.qs) })).filter(x => x.m.seen).sort((a, b) => a.m.pct - b.m.pct).slice(0, 3);
      return `<div class="acc-course c-${c.id}">
        <div class="acc-ch"><span class="abbr">${esc(c.short)}</span><div><b>${esc(c.name)}</b><div class="muted" style="font-size:13px">${cm.seen} of ${cm.total} attempted · ${cm.acc == null ? "no answers yet" : Math.round(cm.acc * 100) + "% accuracy"}</div></div><span class="acc-pct mono">${Math.round(cm.pct * 100)}%</span></div>
        <div class="meter" style="width:100%"><i style="width:${Math.round(cm.pct * 100)}%"></i></div>
        ${weak.length ? `<div class="acc-weak"><span class="muted">Weakest topics</span>${weak.map(x => `<button type="button" class="btn small ghost" data-wk="${esc(x.t.key)}">${esc(x.t.code)} ${esc(x.t.name)} · ${Math.round(x.m.pct * 100)}%</button>`).join("")}</div>` : `<p class="muted" style="margin:0;font-size:13px">Practice a topic to see your weak spots here.</p>`}
      </div>`; }).join("")}</div>
    <h2 class="sec">Recent practice</h2>
    ${sessions.length ? `<div class="tablebox"><table class="rtable"><thead><tr><th>When</th><th>Course</th><th>Set</th><th style="text-align:right">Score</th></tr></thead><tbody>${sessions.slice(0, 12).map(x => `<tr><td class="mono" style="white-space:nowrap">${esc(new Date(x.at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}</td><td>${esc((AP_DATA[x.course] || {}).short || x.course)}</td><td>${esc(x.label)}</td><td class="num">${x.right}/${x.n} (${Math.round(x.right / x.n * 100)}%)</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Finished practice sets will show up here.</p>`}
    <h2 class="sec">Your data</h2>
    <div class="frow" style="margin-top:10px">
      <button class="btn ghost" type="button" id="acc-reset">Reset all my progress</button>
      ${signed && HOSTED ? `<button class="btn ghost" type="button" id="acc-out">Sign out</button>` : ""}
      <span class="muted" style="font-size:13px">${signed && db ? "Your progress is private to your account." : ""}</span>
    </div>
    ${signed && HOSTED ? `<p class="muted" style="font-size:12.5px;margin-top:14px">Account ID <code class="mono" id="acc-uid">${esc(userId)}</code> <button class="linkbtn" type="button" id="acc-uid-copy">Copy</button>${devAllowed ? " · Admin" : " · To make this account a site admin, add this ID in Firestore under <code>admins</code>."}</p>` : ""}`;
  document.getElementById("acc-name").textContent = head.title;
  document.getElementById("acc-sub").textContent = head.sub;
  const $ = id => document.getElementById(id);
  if (HOSTED) wireAuth();
  const sn = $("acc-syncnow"); if (sn) sn.onclick = () => pushSync().then(() => toast(syncState.s === "synced" ? "Synced" : syncLabel()));
  $app.querySelectorAll("[data-wk]").forEach(b => b.onclick = () => { const t = TOPIC[b.dataset.wk]; start(t.course, t.qs, t.code + " " + t.name, prefs.tlen); });
  armConfirm($("acc-reset"), "Click again to erase everything", () => {
    progress = {}; activity = {}; sessions = [];
    save(KEY, progress); save(AKEY, activity); save(SKEY, sessions);
    toast("All progress reset" + (canSync() ? " on every device" : "")); renderAccount();
  });

  // Claude version: consent + linking
  const ckOld = $("ck-old"); if (ckOld) ckOld.onclick = () => { ckOld.disabled = true; ckOld.textContent = "Checking…"; checkOldQs(); };
  const cuOn = $("cu-on"); if (cuOn) cuOn.onclick = async () => { if (await ensureAiConsent()) { toast("AI features will use your Claude usage"); renderAccount(); } };
  const cuOff = $("cu-off"); if (cuOff) cuOff.onclick = () => { delete prefs.aiConsent; save("apdr.prefs", prefs); toast("Turned off. You'll be asked again before any AI request."); renderAccount(); };
  const send = $("lk-send");
  if (send) packLink(linkPayload("claude")).then(code => {
    if (!send.isConnected) return;
    send.href = siteUrl.replace(/#.*$/, "") + "#claude-link=" + code;
    send.onclick = () => { links.google = { email: links.google && links.google.email || "", at: Date.now() }; save(LKEY, links); };
  }).catch(() => { const n = $("lk-note"); if (n) n.textContent = "Linking isn't supported in this browser."; });
  if (!storageWorks() && IN_CLAUDE) { const n = $("lk-note"); if (n) n.textContent = "This browser isn't saving progress here, so link now to keep it."; }
  const imp = $("lk-import"); if (imp) imp.onclick = async () => {
    try {
      const d = await unpackLink($("lk-code").value);
      if (d.src !== "site") throw new Error("wrong direction");
      importLink(d); links.google = { email: d.email || "", at: Date.now() }; save(LKEY, links);
      toast("Added your website progress to this device"); renderAccount();
    } catch (e) { toast("That code didn't work. Copy it again from the website's Account page."); }
  };
  // Website: Claude API key saved to the account (through the relay)
  const wipe = $("ak-wipe"); if (wipe) armConfirm(wipe, "Click again to remove your key", async () => {
    try { keyStatus = await keyApi.wipe(); visitConsent = false; toast("Your API key was removed from your account"); } catch (e) { toast(sampleErr(e) || "Couldn't remove the key. Try again."); }
    renderAccount();
  });
  const toClaude = $("lk-claude"); if (toClaude) toClaude.onclick = () => {
    packLink(linkPayload("site")).then(code => navigator.clipboard.writeText(code)).then(
      () => toast("Link code copied. In Claude, paste it under Account → Bring progress from the website."),
      () => {});
  };
  const cvs = $("cv-submit"); if (cvs) cvs.onclick = () => { cvs.disabled = true; cvs.textContent = "Sharing…"; submitClaudeQs(false).finally(() => renderAccount()); };
  const repl = $("ak-replace"); if (repl) repl.onclick = () => { replacingKey = true; renderAccount(); };
  const cancel = $("ak-cancel"); if (cancel) cancel.onclick = () => { replacingKey = false; renderAccount(); };
  const akForm = $("ak-form"); if (akForm) akForm.onsubmit = async e => {
    e.preventDefault();
    const v = $("ak-key").value.trim(), err = $("ak-err"), btn = $("ak-save");
    const fail = msg => { err.hidden = false; err.textContent = msg; };
    if (!/^sk-ant-[A-Za-z0-9_-]{20,}$/.test(v)) return fail("That doesn't look like a Claude API key. Keys start with sk-ant-.");
    if (!$("ak-agree").checked) return fail("Check the box to confirm AI features will use your Claude API credits.");
    btn.disabled = true; btn.textContent = "Checking with Anthropic…";
    try { keyStatus = await keyApi.save(v); replacingKey = false; visitConsent = false; $("ak-key").value = ""; toast("Key saved to your account. AI features are on."); renderAccount(); }
    catch (e2) { btn.disabled = false; btn.textContent = "Save key to my account"; fail(e2.code === "bad_key" ? "Anthropic rejected that key. Check it and try again." : (sampleErr(e2) || "Couldn't save the key. Try again.")); }
  };
}
let replacingKey = false;
updateAccountChip();

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ---------- boot ---------- */
if (HOSTED) {
  const hh = location.hash || "";
  if (hh.indexOf("#claude-link=") === 0) {
    pendingLink = hh.slice("#claude-link=".length);
    try { sessionStorage.setItem("apdr.pendingLink", pendingLink); } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  } else { try { pendingLink = sessionStorage.getItem("apdr.pendingLink"); } catch (e) {} }
}
if (HOSTED) { try { initHosted(); } catch (e) { console.error("Firebase failed to start", e); meKnown = true; dbKnown = true; db = null; } }
const h = (location.hash || "").slice(1);
if (AP_DATA[h]) view = { name: "course", cid: h };
if (pendingLink) view = { name: "account" };
rerender();
})();
</script>

</body>
</html>
